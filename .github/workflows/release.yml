name: Release

# only runs when a version tag like v1.0.0 is pushed. this is the only
# workflow that pushes images to the registry
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

      # v1.0.0 -> 1.0.0, taken from the tag itself so nothing is hard-coded.
      # registry paths have to be lowercase, hence the ,,
      - name: Get version from tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/student-ml-api" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # stops a v1.1.0 tag from shipping an app that still says 1.0.0
      - name: Check tag matches VERSION file
        run: |
          FILE_VERSION="$(cat VERSION)"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "Tag says $VERSION but VERSION file says $FILE_VERSION"
            exit 1
          fi
          echo "Releasing version $VERSION"

      # GITHUB_TOKEN is created by actions for each run, so no password
      # or personal token is stored anywhere in the repo
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # version, commit and build time get baked into the image as OCI labels
      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=$VERSION \
            --build-arg GIT_COMMIT=$GITHUB_SHA \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t student-ml-api:$VERSION .

      # the short sha tag never moves, unlike latest, so it always points
      # at the image built from that exact commit
      - name: Apply version tags
        run: |
          docker tag student-ml-api:$VERSION $IMAGE:$VERSION
          docker tag student-ml-api:$VERSION $IMAGE:latest
          docker tag student-ml-api:$VERSION $IMAGE:$SHORT_SHA

      - name: Push Docker image
        run: |
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest
          docker push $IMAGE:$SHORT_SHA

      # shows up on the run page, so tag -> commit -> image -> digest
      # is all in one place
      - name: Write release summary
        run: |
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' $IMAGE:$VERSION)
          {
            echo "## Released $IMAGE:$VERSION"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Git tag | \`$GITHUB_REF_NAME\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Image tags | \`$VERSION\`, \`latest\`, \`$SHORT_SHA\` |"
            echo "| Digest | \`${DIGEST#*@}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
